; Listless default Ruby style. See docs/08-style-config.md.
;
; =begin/=end block comments are not modeled because they are line-oriented
; keywords rather than a simple delimiter pair.

Style Ruby (.rb) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:$
	Strings => "'
	Escape => \
	SingleLineComment => #
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => alias
	Reserved => and
	Reserved => begin
	Reserved => break
	Reserved => case
	Reserved => class
	Reserved => def
	Reserved => defined?
	Reserved => do
	Reserved => else
	Reserved => elsif
	Reserved => end
	Reserved => ensure
	Reserved => false
	Reserved => for
	Reserved => if
	Reserved => in
	Reserved => module
	Reserved => next
	Reserved => nil
	Reserved => not
	Reserved => or
	Reserved => redo
	Reserved => rescue
	Reserved => retry
	Reserved => return
	Reserved => self
	Reserved => super
	Reserved => then
	Reserved => true
	Reserved => undef
	Reserved => unless
	Reserved => until
	Reserved => when
	Reserved => while
	Reserved => yield
}
