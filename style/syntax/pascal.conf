; Listless default Pascal style (Free Pascal/Delphi-family; also covers
; classic Standard Pascal, which is a subset). See
; docs/08-style-config.md.

Style Pascal (.pas .pp .inc) Common
{
	Symbols => (){}[];,.:=<>+-*/^@
	Strings => '
	OpenComment => {
	CloseComment => }
	OpenComment => (*
	CloseComment => *)
	SingleLineComment => //
	NumberPrefix => $
	CaseSensitive => Off

	Reserved => and
	Reserved => array
	Reserved => begin
	Reserved => case
	Reserved => class
	Reserved => const
	Reserved => constructor
	Reserved => destructor
	Reserved => div
	Reserved => do
	Reserved => downto
	Reserved => else
	Reserved => end
	Reserved => except
	Reserved => exit
	Reserved => false
	Reserved => file
	Reserved => finally
	Reserved => for
	Reserved => function
	Reserved => goto
	Reserved => if
	Reserved => implementation
	Reserved => in
	Reserved => inherited
	Reserved => interface
	Reserved => label
	Reserved => mod
	Reserved => nil
	Reserved => not
	Reserved => of
	Reserved => or
	Reserved => override
	Reserved => packed
	Reserved => private
	Reserved => procedure
	Reserved => program
	Reserved => protected
	Reserved => public
	Reserved => raise
	Reserved => record
	Reserved => repeat
	Reserved => set
	Reserved => then
	Reserved => to
	Reserved => true
	Reserved => try
	Reserved => type
	Reserved => unit
	Reserved => until
	Reserved => uses
	Reserved => var
	Reserved => virtual
	Reserved => while
	Reserved => with
	Reserved => xor
}
