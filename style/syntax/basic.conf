; Listless default BASIC style (classic line-numbered Microsoft BASIC
; dialects -- QBasic/GW-BASIC family). See docs/08-style-config.md.
;
; REM-style comments aren't modeled: SingleLineComment matches a literal
; delimiter, not a keyword with word-boundary awareness, so "REM" is
; listed as a plain Reserved word instead (still coloured, just not
; treated as starting a comment region) -- use ' for an actual comment.

Style Basic (.bas) Common
{
	Symbols => (),;:=<>+-*/^
	Strings => "
	SingleLineComment => '
	NumberPrefix => &H
	CaseSensitive => Off

	Reserved => and
	Reserved => as
	Reserved => beep
	Reserved => case
	Reserved => cls
	Reserved => close
	Reserved => color
	Reserved => const
	Reserved => data
	Reserved => def
	Reserved => dim
	Reserved => do
	Reserved => else
	Reserved => elseif
	Reserved => end
	Reserved => erase
	Reserved => false
	Reserved => for
	Reserved => function
	Reserved => gosub
	Reserved => goto
	Reserved => if
	Reserved => input
	Reserved => kill
	Reserved => let
	Reserved => line
	Reserved => locate
	Reserved => loop
	Reserved => name
	Reserved => next
	Reserved => not
	Reserved => on
	Reserved => open
	Reserved => or
	Reserved => out
	Reserved => peek
	Reserved => poke
	Reserved => print
	Reserved => randomize
	Reserved => read
	Reserved => rem
	Reserved => restore
	Reserved => return
	Reserved => select
	Reserved => shared
	Reserved => step
	Reserved => stop
	Reserved => sub
	Reserved => swap
	Reserved => system
	Reserved => then
	Reserved => to
	Reserved => true
	Reserved => until
	Reserved => wend
	Reserved => while
	Reserved => width
	Reserved => write
	Reserved => xor
}
