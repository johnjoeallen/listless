; Listless default Kotlin style. See docs/08-style-config.md.
;
; Triple-quoted raw strings are not modeled by this tokenizer.

Style Kotlin (.kt .kts) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => "'
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => as
	Reserved => break
	Reserved => class
	Reserved => continue
	Reserved => do
	Reserved => else
	Reserved => false
	Reserved => for
	Reserved => fun
	Reserved => if
	Reserved => in
	Reserved => interface
	Reserved => is
	Reserved => null
	Reserved => object
	Reserved => package
	Reserved => return
	Reserved => super
	Reserved => this
	Reserved => throw
	Reserved => true
	Reserved => try
	Reserved => typealias
	Reserved => typeof
	Reserved => val
	Reserved => var
	Reserved => when
	Reserved => while
	Reserved => abstract
	Reserved => actual
	Reserved => annotation
	Reserved => companion
	Reserved => const
	Reserved => crossinline
	Reserved => data
	Reserved => enum
	Reserved => expect
	Reserved => external
	Reserved => final
	Reserved => infix
	Reserved => inline
	Reserved => inner
	Reserved => internal
	Reserved => lateinit
	Reserved => noinline
	Reserved => open
	Reserved => operator
	Reserved => out
	Reserved => override
	Reserved => private
	Reserved => protected
	Reserved => public
	Reserved => reified
	Reserved => sealed
	Reserved => suspend
	Reserved => tailrec
	Reserved => vararg
}
