; Listless default Go style. See docs/08-style-config.md.
;
; Backtick raw strings use the same escape handling as quoted strings because
; this tokenizer cannot specialize handling for individual delimiters.

Style Go (.go) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => "'`
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => break
	Reserved => case
	Reserved => chan
	Reserved => const
	Reserved => continue
	Reserved => default
	Reserved => defer
	Reserved => else
	Reserved => fallthrough
	Reserved => for
	Reserved => func
	Reserved => go
	Reserved => goto
	Reserved => if
	Reserved => import
	Reserved => interface
	Reserved => map
	Reserved => package
	Reserved => range
	Reserved => return
	Reserved => select
	Reserved => struct
	Reserved => switch
	Reserved => type
	Reserved => var
}
