; Listless default C/C++ style. See docs/08-style-config.md.

Style Cpp (.c .h .cpp .hpp .cc .cxx .hxx) Common
{
	Symbols => (){};,.+-*/%=<>!&|^~[]
	Strings => "'
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	NumberPrefix => 0x
	OpenPreProcessor => #
	LineContinuation => \
	CaseSensitive => TRUE

	Reserved => alignas
	Reserved => alignof
	Reserved => auto
	Reserved => bool
	Reserved => break
	Reserved => case
	Reserved => catch
	Reserved => char
	Reserved => class
	Reserved => const
	Reserved => constexpr
	Reserved => continue
	Reserved => default
	Reserved => delete
	Reserved => do
	Reserved => double
	Reserved => else
	Reserved => enum
	Reserved => explicit
	Reserved => extern
	Reserved => false
	Reserved => float
	Reserved => for
	Reserved => friend
	Reserved => goto
	Reserved => if
	Reserved => inline
	Reserved => int
	Reserved => long
	Reserved => mutable
	Reserved => namespace
	Reserved => new
	Reserved => noexcept
	Reserved => nullptr
	Reserved => operator
	Reserved => override
	Reserved => private
	Reserved => protected
	Reserved => public
	Reserved => return
	Reserved => short
	Reserved => signed
	Reserved => sizeof
	Reserved => static
	Reserved => struct
	Reserved => switch
	Reserved => template
	Reserved => this
	Reserved => throw
	Reserved => true
	Reserved => try
	Reserved => typedef
	Reserved => typename
	Reserved => union
	Reserved => unsigned
	Reserved => using
	Reserved => virtual
	Reserved => void
	Reserved => volatile
	Reserved => while
}
