; Listless default YAML style. See docs/08-style-config.md.
;
; Uses generic contextual rules for keys, block scalars, sequence markers,
; and directive, tag, anchor, and alias prefixes.

Style Yaml (.yaml .yml) Common
{
	StringColor => Green
	BlockTextColor => Yellow
	LineStartDataColor => Green
	Symbols => {}[],:-?&*!|>@
	Strings => "'
	Escape => \
	SingleLineComment => #
	CaseSensitive => On
	BeforeDelimiter => :
	BeforeDelimiterRequiresSpace => On
	BlockTextStart => |>
	LineStartPrefix => -
	LineStartPrefixRequiresSpace => On
	PrefixToken => &*!%

	Reserved => false
	Reserved => null
	Reserved => true
}
