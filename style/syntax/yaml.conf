; Listless default YAML style. See docs/08-style-config.md.
;
; Block scalar and tag/anchor semantics are not modeled by this tokenizer.

Style Yaml (.yaml .yml) Common
{
	StringColor => Green
	BlockTextColor => Yellow
	Symbols => {}[],:-?&*!|>@
	Strings => "'
	Escape => \
	SingleLineComment => #
	CaseSensitive => On
	BeforeDelimiter => :
	BlockTextStart => |>
	LineStartPrefix => -
	PrefixToken => &*!%

	Reserved => false
	Reserved => null
	Reserved => true
}
