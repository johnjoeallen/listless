; Listless default C# style. See docs/08-style-config.md.
;
; Verbatim and interpolated strings are not modeled by this tokenizer.

Style CSharp (.cs) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => "'
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	OpenPreProcessor => #
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => abstract
	Reserved => as
	Reserved => async
	Reserved => await
	Reserved => base
	Reserved => bool
	Reserved => break
	Reserved => byte
	Reserved => case
	Reserved => catch
	Reserved => char
	Reserved => checked
	Reserved => class
	Reserved => const
	Reserved => continue
	Reserved => decimal
	Reserved => default
	Reserved => delegate
	Reserved => do
	Reserved => double
	Reserved => else
	Reserved => enum
	Reserved => event
	Reserved => explicit
	Reserved => extern
	Reserved => false
	Reserved => finally
	Reserved => fixed
	Reserved => float
	Reserved => for
	Reserved => foreach
	Reserved => goto
	Reserved => if
	Reserved => implicit
	Reserved => in
	Reserved => int
	Reserved => interface
	Reserved => internal
	Reserved => is
	Reserved => lock
	Reserved => long
	Reserved => namespace
	Reserved => new
	Reserved => null
	Reserved => object
	Reserved => operator
	Reserved => out
	Reserved => override
	Reserved => params
	Reserved => private
	Reserved => protected
	Reserved => public
	Reserved => readonly
	Reserved => ref
	Reserved => return
	Reserved => sbyte
	Reserved => sealed
	Reserved => short
	Reserved => sizeof
	Reserved => stackalloc
	Reserved => static
	Reserved => string
	Reserved => struct
	Reserved => switch
	Reserved => this
	Reserved => throw
	Reserved => true
	Reserved => try
	Reserved => typeof
	Reserved => uint
