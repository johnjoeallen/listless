; Listless default Python style. See docs/08-style-config.md.
;
; No block-comment support here: string_delimiter matches single
; characters, so Python's triple-quoted """ docstrings aren't modeled --
; only the "# ..." end-of-line comment and single/double-quoted strings.

Style Python (.py .pyw) Common
{
	Symbols => (){}[]:,.+-*/%=<>!&|^~
	Strings => "'
	Escape => \
	SingleLineComment => #
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => False
	Reserved => None
	Reserved => True
	Reserved => and
	Reserved => as
	Reserved => assert
	Reserved => async
	Reserved => await
	Reserved => break
	Reserved => class
	Reserved => continue
	Reserved => def
	Reserved => del
	Reserved => elif
	Reserved => else
	Reserved => except
	Reserved => finally
	Reserved => for
	Reserved => from
	Reserved => global
	Reserved => if
	Reserved => import
	Reserved => in
	Reserved => is
	Reserved => lambda
	Reserved => nonlocal
	Reserved => not
	Reserved => or
	Reserved => pass
	Reserved => raise
	Reserved => return
	Reserved => try
	Reserved => while
	Reserved => with
	Reserved => yield
}
