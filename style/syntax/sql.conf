; Listless default SQL style. See docs/08-style-config.md.

Style Sql (.sql) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => '
	OpenComment => /*
	CloseComment => */
	SingleLineComment => --
	CaseSensitive => Off

	Reserved => SELECT
	Reserved => FROM
	Reserved => WHERE
	Reserved => GROUP
	Reserved => BY
	Reserved => ORDER
	Reserved => HAVING
	Reserved => JOIN
	Reserved => INNER
