	Reserved => RIGHT
	Reserved => FULL
	Reserved => OUTER
	Reserved => ON
	Reserved => AS
	Reserved => DISTINCT
	Reserved => UNION
	Reserved => ALL
	Reserved => INSERT
	Reserved => INTO
	Reserved => VALUES
	Reserved => UPDATE
	Reserved => SET
	Reserved => DELETE
	Reserved => CREATE
	Reserved => TABLE
