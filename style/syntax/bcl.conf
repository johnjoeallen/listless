; Listless default BASCAL style (.bcl source files -- a structured
; transpiler-to-BASIC language; see
; https://johnjoeallen.github.io/bascal/manual.html). See
; docs/08-style-config.md.

Style Bcl (.bcl) Common
{
	Symbols => (){}[]:,.+-*/^=<>!$%#
	Strings => "
	SingleLineComment => '
	SingleLineComment => //
	OpenComment => /*
	CloseComment => */
	NumberPrefix => &H
	CaseSensitive => Off

	Reserved => and
