; Listless default Perl style. See docs/08-style-config.md.
;
; No block-comment support here: Perl's =pod/=cut POD blocks aren't a
; simple delimiter pair, so only the "# ..." end-of-line comment is
; modeled. Sigils ($ @ %) are listed as Symbols rather than fused to the
; identifier that follows -- this tokenizer colours a variable's sigil
; and name as separate tokens, a simplification, not a full Perl lexer.

Style Perl (.pl .pm .t) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:$@
	Strings => "'
	Escape => \
	SingleLineComment => #
	CaseSensitive => On

	Reserved => and
	Reserved => bless
	Reserved => cmp
	Reserved => defined
	Reserved => delete
	Reserved => die
	Reserved => do
	Reserved => each
	Reserved => elsif
	Reserved => else
	Reserved => eq
	Reserved => eval
	Reserved => exists
	Reserved => for
	Reserved => foreach
	Reserved => ge
	Reserved => grep
	Reserved => gt
	Reserved => if
	Reserved => keys
	Reserved => last
	Reserved => le
	Reserved => local
	Reserved => lt
	Reserved => map
	Reserved => my
	Reserved => ne
	Reserved => next
	Reserved => no
	Reserved => not
	Reserved => or
	Reserved => our
	Reserved => package
	Reserved => pop
	Reserved => print
	Reserved => push
	Reserved => qw
	Reserved => redo
	Reserved => ref
	Reserved => require
	Reserved => return
	Reserved => shift
	Reserved => sort
	Reserved => splice
	Reserved => sub
	Reserved => undef
	Reserved => unless
	Reserved => unshift
	Reserved => until
	Reserved => use
	Reserved => wantarray
	Reserved => warn
	Reserved => while
	Reserved => xor
}
