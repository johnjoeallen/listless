; Listless default Java style. See docs/08-style-config.md.

Style Java (.java) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => "'
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	NumberPrefix => 0x
	CaseSensitive => On

