; Listless default TypeScript style. See docs/08-style-config.md.
;
; Template-literal strings are not modeled: this tokenizer supports only
; single-character delimiters, not multi-line strings with interpolation.

Style TypeScript (.ts .tsx) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => "'
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => abstract
	Reserved => any
	Reserved => as
	Reserved => asserts
	Reserved => async
	Reserved => await
	Reserved => boolean
	Reserved => break
	Reserved => case
	Reserved => catch
	Reserved => class
	Reserved => const
	Reserved => continue
	Reserved => debugger
	Reserved => declare
	Reserved => default
	Reserved => delete
	Reserved => do
	Reserved => else
	Reserved => enum
	Reserved => export
	Reserved => extends
	Reserved => false
	Reserved => finally
	Reserved => for
	Reserved => function
	Reserved => if
	Reserved => implements
	Reserved => import
	Reserved => in
	Reserved => infer
	Reserved => instanceof
	Reserved => interface
	Reserved => is
	Reserved => keyof
	Reserved => let
	Reserved => module
	Reserved => namespace
	Reserved => never
	Reserved => new
	Reserved => null
	Reserved => number
	Reserved => object
	Reserved => of
	Reserved => private
	Reserved => protected
	Reserved => public
	Reserved => readonly
	Reserved => return
	Reserved => static
	Reserved => string
	Reserved => super
