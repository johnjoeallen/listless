; Listless default Lua style. See docs/08-style-config.md.
;
; Long-bracket strings are not modeled by this tokenizer.

Style Lua (.lua) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => "'
	Escape => \
	OpenComment => --[[
	CloseComment => ]]
	SingleLineComment => --
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => and
	Reserved => break
	Reserved => do
	Reserved => else
	Reserved => elseif
	Reserved => end
	Reserved => false
	Reserved => for
	Reserved => function
	Reserved => goto
	Reserved => if
	Reserved => in
	Reserved => local
	Reserved => nil
	Reserved => not
	Reserved => or
	Reserved => repeat
	Reserved => return
	Reserved => then
	Reserved => true
	Reserved => until
	Reserved => while
}
