; Listless default PHP style. See docs/08-style-config.md.
;
; No <?php ?> tag handling -- OpenPreProcessor models a single directive
; prefix (like C's #), which doesn't fit PHP's paired open/close tags;
; not modeled here.

Style Php (.php .phtml) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:$
	Strings => "'
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	SingleLineComment => #
	NumberPrefix => 0x
	CaseSensitive => Off

	Reserved => abstract
	Reserved => and
	Reserved => array
	Reserved => as
	Reserved => break
	Reserved => callable
	Reserved => case
	Reserved => catch
	Reserved => class
	Reserved => clone
	Reserved => const
	Reserved => continue
	Reserved => declare
	Reserved => default
	Reserved => do
	Reserved => echo
	Reserved => else
	Reserved => elseif
	Reserved => empty
	Reserved => enddeclare
	Reserved => endfor
	Reserved => endforeach
	Reserved => endif
	Reserved => endswitch
	Reserved => endwhile
	Reserved => extends
	Reserved => false
