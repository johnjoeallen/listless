; Listless default Swift style. See docs/08-style-config.md.
;
; Nested block comments, triple-quoted strings, and interpolation are not
; modeled by this tokenizer.

Style Swift (.swift) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => "
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => associatedtype
	Reserved => class
	Reserved => deinit
	Reserved => enum
	Reserved => extension
	Reserved => fileprivate
	Reserved => func
	Reserved => import
	Reserved => init
	Reserved => inout
	Reserved => internal
	Reserved => let
	Reserved => open
	Reserved => operator
	Reserved => private
	Reserved => protocol
	Reserved => public
	Reserved => rethrows
	Reserved => static
	Reserved => struct
	Reserved => subscript
	Reserved => typealias
	Reserved => var
	Reserved => break
	Reserved => case
	Reserved => continue
	Reserved => default
	Reserved => defer
	Reserved => do
	Reserved => else
	Reserved => fallthrough
	Reserved => for
	Reserved => guard
	Reserved => if
	Reserved => in
	Reserved => repeat
	Reserved => return
	Reserved => switch
	Reserved => where
	Reserved => while
	Reserved => as
	Reserved => Any
	Reserved => catch
	Reserved => false
	Reserved => is
	Reserved => nil
	Reserved => self
	Reserved => Self
	Reserved => super
	Reserved => throw
	Reserved => throws
	Reserved => true
	Reserved => try
}
