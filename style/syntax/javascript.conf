; Listless default JavaScript style. See docs/08-style-config.md.
;
; Template-literal strings are not modeled: this tokenizer supports only
; single-character delimiters, not multi-line strings with interpolation.

Style JavaScript (.js .mjs .cjs) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => "'
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => async
	Reserved => await
	Reserved => break
	Reserved => case
	Reserved => catch
	Reserved => class
	Reserved => const
	Reserved => continue
	Reserved => debugger
	Reserved => default
	Reserved => delete
	Reserved => do
	Reserved => else
	Reserved => export
	Reserved => extends
	Reserved => false
	Reserved => finally
	Reserved => for
	Reserved => function
	Reserved => if
	Reserved => import
	Reserved => in
	Reserved => instanceof
	Reserved => let
	Reserved => new
	Reserved => null
	Reserved => of
	Reserved => return
	Reserved => static
	Reserved => super
	Reserved => switch
	Reserved => this
	Reserved => throw
	Reserved => true
	Reserved => try
	Reserved => typeof
	Reserved => undefined
	Reserved => var
	Reserved => void
	Reserved => while
	Reserved => with
	Reserved => yield
}
