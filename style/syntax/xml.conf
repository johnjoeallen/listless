; Listless default XML style. See docs/08-style-config.md.
;
; The generic highlighter recognizes tag-like text before `>` but does not
; parse XML namespaces, entities, DTDs, or processing-instruction grammar.

Style Xml (.xml .xsd .xsl .xslt) Common
{
	StringColor => Green
	Symbols => <>/=?![]
	Strings => "'
	OpenComment => <!--
	CloseComment => -->
	BeforeDelimiter => >
	CaseSensitive => On
}
