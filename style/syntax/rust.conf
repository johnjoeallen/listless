; Listless default Rust style. See docs/08-style-config.md.
;
; Nested block comments and raw strings are not modeled by this tokenizer.

Style Rust (.rs) Common
{
	Symbols => (){}[];,.+-*/%=<>!&|^~?:
	Strings => "
	Escape => \
	OpenComment => /*
	CloseComment => */
	SingleLineComment => //
	NumberPrefix => 0x
	CaseSensitive => On

	Reserved => as
	Reserved => async
	Reserved => await
	Reserved => break
	Reserved => const
	Reserved => continue
	Reserved => crate
	Reserved => dyn
	Reserved => else
	Reserved => enum
	Reserved => extern
	Reserved => false
	Reserved => fn
	Reserved => for
	Reserved => if
	Reserved => impl
	Reserved => in
	Reserved => let
	Reserved => loop
	Reserved => match
	Reserved => mod
	Reserved => move
	Reserved => mut
	Reserved => pub
	Reserved => ref
	Reserved => return
	Reserved => self
	Reserved => Self
	Reserved => static
	Reserved => struct
	Reserved => super
	Reserved => trait
	Reserved => true
	Reserved => type
	Reserved => unsafe
	Reserved => use
	Reserved => where
	Reserved => while
}
