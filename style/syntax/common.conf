; Listless default styles -- shared base for the per-language styles in
; this directory. See docs/08-style-config.md.
;
; Not tied to any file extension itself -- only exists to be a BaseStyle.
; load_config_dir() pre-registers every style name across every file in
; this directory before parsing any file's fields, so it doesn't matter
; that files like cpp.conf (which use this as a BaseStyle) sort before
; this one alphabetically.

Style Common ()
{
	IdentColor => White
	NumberColor => Yellow
	StringColor => LightRed
	CommentColor => Green
	SymbolsColor => Cyan
	ReservedColor => LightBlue
	PreProcessorColor => Magenta
}
