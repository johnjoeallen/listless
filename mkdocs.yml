site_name: Listless
site_description: >-
  A portable file and directory viewer for Linux, Windows, and macOS —
  the modern continuation of OnScreen/2.
site_url: https://johnjoeallen.github.io/listless/
repo_url: https://github.com/johnjoeallen/listless
repo_name: johnjoeallen/listless
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/listless-icon.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Repository README: https://github.com/johnjoeallen/listless/blob/main/README.md
  - Listless guide:
      - Getting started: getting-started.md
      - Usage: usage.md
      - Syntax highlighting: syntax-highlighting.md
      - Configuration: configuration.md
      - Roadmap: roadmap.md
  - Porting record:
      - Overview: porting/index.md
      - Status: porting/status.md
      - Original architecture: porting/architecture.md
      - About:
          - "The original: OnScreen/2": porting/original.md
          - "The target: Listless": porting/target.md
      - Subsystems:
          - "01. String/container primitives": porting/01-string-container-primitives.md
          - "02. Search primitives": porting/02-search-primitives.md
          - "03. Directory enumeration": porting/03-directory-enumeration.md
          - "04. Console/terminal I/O": porting/04-console-terminal-io.md
          - "05. Keyboard input": porting/05-keyboard-input.md
          - "06. File-list UI": porting/06-file-list-ui.md
          - "07. File viewer core": porting/07-file-viewer-core.md
          - "08. Style/config system": porting/08-style-config.md
          - "09. Syntax highlighting": porting/09-syntax-highlighting.md
          - "10. Hex-mode viewer": porting/10-hex-mode-viewer.md
          - "App entry point / main loop": porting/app-main-loop.md
